# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Celery

on:
  push:
    branches: [ 'main']
    paths:
        - '**.py'
        - '**.txt'
        - '.github/workflows/python-package.yml'
        - '.github/workflows/integration-tests.yml'
        - '.github/workflows/smoke-tests.yml'
        - '**.toml'
        - "tox.ini"
  pull_request:
    branches: [ 'main', 'sticky-proof' ]
    paths:
        - '**.py'
        - '**.txt'
        - '**.toml'
        - '.github/workflows/python-package.yml'
        - '.github/workflows/integration-tests.yml'
        - '.github/workflows/smoke-tests.yml'
        - "tox.ini"
  workflow_dispatch:


permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  Due-work:
    # Celery's worker failing at each stage, checked by the contract in t/due_work (pytest-obligation).
    # It starts its own workers, so it runs apart from the integration suite. Linux only: the faults
    # reach the pool child through fork.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # the report's one PR comment; a fork PR's token stays read-only
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: '**/setup.py'
      - name: Install tox
        run: python -m pip install --upgrade pip 'tox' tox-gh-actions
      - name: Run tox for "3.13-due_work"
        id: tests
        run: tox --verbose --verbose -e 3.13-due_work -- --due-work-profile-report=obligation-profiles.json
      - name: Report what the contract proved
        if: ${{ !cancelled() }}
        uses: gigaverse-app/pytest-obligation/report@8100b177f9017c60d42a60c482f95083acb1301d # same revision as publish (artifact layout); v1 once released
        with:
          application-paths: t/due_work
          report-path: obligation-profiles.json
          expected-reports: '1'
          test-outcome: ${{ steps.tests.outcome }}
          sticky-key: celery-worker-contract
